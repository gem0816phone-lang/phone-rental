<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>租借預約</title>
    <meta
      name="description"
      content="vivo X300 Ultra ｜ G2 Ultra 增距鏡 ｜ Ray-Ban Meta 智慧眼鏡"
    />
    <link rel="canonical" href="https://gem0816phone.github.io/phone-rental/" />
    <meta property="og:title" content="租借預約" />
    <meta
      property="og:description"
      content="vivo X300 Ultra ｜ G2 Ultra 增距鏡 ｜ Ray-Ban Meta 智慧眼鏡"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gem0816phone.github.io/phone-rental/" />
    <meta property="og:site_name" content="租借預約" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="租借預約" />
    <meta
      name="twitter:description"
      content="vivo X300 Ultra ｜ G2 Ultra 增距鏡 ｜ Ray-Ban Meta 智慧眼鏡"
    />
    <link rel="stylesheet" href="styles.css?v=calendar-20260823-54" />
    <script src="config.js?v=calendar-20260823-54" defer></script>
    <script src="script.js?v=calendar-20260823-54" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#booking" aria-label="回到租借預約">
        <span class="brand-gem" aria-hidden="true"></span>
        <span>租借預約</span>
      </a>
      <a class="header-contact thread-link" href="https://www.threads.com/@gem0816phone" target="_blank" rel="noopener">
        <span class="thread-icon" aria-hidden="true">@</span>
        <span>聯絡資訊</span>
        <span aria-hidden="true">｜</span>
        <span>@gem0816phone</span>
      </a>
    </header>

    <main>
      <section class="hero" id="booking">
        <aside class="booking-panel" aria-labelledby="booking-title">
          <div class="panel-heading">
            <h2 id="booking-title">預約表單 ｜ <span class="booking-title-note">聯絡並交付訂金後才會鎖定檔期</span></h2>
          </div>

          <form class="booking-form" id="reservationForm">
            <input type="hidden" name="model" />
            <input type="hidden" name="selectedItems" />
            <input type="hidden" name="rentalPackage" />
            <input type="hidden" name="rentalStart" />
            <input type="hidden" name="rentalEnd" />
            <input type="hidden" name="selectedDates" />

            <div class="booking-steps" aria-label="預約步驟">
              <button class="step-pill is-active" type="button" id="itemStepPill">1 選物品</button>
              <button class="step-pill" type="button" id="dateStepPill" disabled>2 選日期</button>
              <button class="step-pill" type="button" id="detailsStepPill" disabled>3 填資料</button>
            </div>

            <section class="item-step" id="itemStep">
              <div class="item-grid" id="itemGrid" aria-label="選擇要租的物品"></div>
              <div class="selection-summary" id="itemSummaryBox" hidden></div>
              <button class="button primary" type="button" id="itemContinueButton" disabled>下一步選擇日期</button>
            </section>

            <section class="date-step" id="dateStep" hidden>
              <article class="selection-summary date-selection-summary" id="packageSummary" aria-label="已選租借物品"></article>

              <div class="calendar-toolbar">
                <button class="icon-button" type="button" id="prevMonthButton" aria-label="上一個月">‹</button>
                <strong id="monthLabel">月份</strong>
                <button class="icon-button" type="button" id="nextMonthButton" aria-label="下一個月">›</button>
              </div>

              <div class="calendar-status-row">
                <div class="calendar-legend" aria-label="日期狀態說明">
                  <span class="legend-available"><i class="status-dot available"></i>可選</span>
                  <span class="legend-full"><i class="status-dot full"></i>已滿</span>
                </div>
                <div class="availability-status" id="availabilityStatus">正在同步可選日期...</div>
              </div>

              <div class="calendar-weekdays" aria-hidden="true">
                <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
              </div>
              <div class="calendar-grid" id="calendarGrid" aria-label="租借日期日曆"></div>

              <div class="estimate" id="estimateBox">請先在日曆上選擇要租的日期。</div>
              <button class="button primary" type="button" id="continueButton" disabled>下一步填寫資料</button>
            </section>

            <section class="details-step" id="detailsStep" hidden>
              <div class="form-grid location-grid">
                <label>
                  <span>取機地點</span>
                  <select name="pickupLocation" id="pickupLocation" required></select>
                </label>
                <label>
                  <span>還機地點</span>
                  <select name="dropoffLocation" id="dropoffLocation" required></select>
                </label>
              </div>

              <div class="form-grid">
                <label>
                  <span>姓名</span>
                  <input type="text" name="customerName" autocomplete="name" required />
                </label>
                <label>
                  <span>電話</span>
                  <input
                    type="tel"
                    name="phone"
                    autocomplete="tel"
                    inputmode="numeric"
                    pattern="09[0-9]{8}"
                    maxlength="10"
                    title="請輸入 09 開頭的 10 碼手機號碼，例如 0912345678"
                    required
                  />
                </label>
                <label class="full-row">
                  <span>thread 帳號</span>
                  <input type="text" name="lineId" autocomplete="off" required />
                </label>
              </div>

              <fieldset class="deposit-options" id="depositOptions"></fieldset>
              <div class="deposit-notice" id="depositNotice" hidden></div>
              <div class="selected-review" id="selectedDatesReview"></div>

              <div class="form-actions">
                <button class="button primary" type="submit" id="submitButton">送出預約</button>
              </div>
            </section>

            <label class="honeypot" aria-hidden="true">
              <span>公司網站</span>
              <input type="text" name="companyWebsite" tabindex="-1" autocomplete="off" />
            </label>
            <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
          </form>

          <dialog class="booked-dialog" id="bookedDialog" aria-labelledby="bookedDialogTitle">
            <h3 id="bookedDialogTitle">此日期已滿</h3>
            <div class="booked-dialog-body" id="bookedDialogBody"></div>
            <button class="button primary" type="button" id="bookedDialogClose">知道了</button>
          </dialog>

          <dialog class="booked-dialog success-dialog" id="successDialog" aria-label="預約送出成功">
            <div class="success-dialog-body" id="successDialogBody"></div>
            <button class="button primary" type="button" id="successDialogConfirm">確認</button>
          </dialog>
        </aside>
      </section>

    </main>

  </body>
</html>
